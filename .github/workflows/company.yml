name: Őrtorony · vállalati elemzés (Modul 02)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker (pl. IREN, NVDA, ASML). Üresen hagyva: watchlist-rotáció.'
        required: false
        type: string
  schedule:
    # hetente egyszer, hétfő 06:00 UTC — a watchlist follow:true tételei közül a legrégebben elemzett
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: ortorony-company
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Elemzés futtatása
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            node scripts/company.mjs "${{ github.event.inputs.ticker }}"
          else
            node scripts/company.mjs --rotate
          fi

      - name: Commit + push
        run: |
          git config user.name  "ortorony-bot"
          git config user.email "ortorony-bot@users.noreply.github.com"
          git add data/company
          git diff --cached --quiet && echo "nincs változás" && exit 0
          git commit -m "Modul 02: vállalati elemzés — ${{ github.event.inputs.ticker || 'watchlist-rotáció' }} ($(date -u +%F))"
          git push
