<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Őrtorony — napi piac- és szektor-jelentés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --frame:#161a21;        /* dark masthead / terminal frame */
    --frame-ink:#e6e9ee;
    --frame-dim:#8b93a1;
    --paper:#ecedef;        /* cool reading surface (not cream) */
    --card:#ffffff;
    --ink:#1b1f27;
    --muted:#666f7d;
    --rule:#d7dbe0;
    --accent:#2f6f7a;       /* petrol — links / active */
    --confirmed:#3f7d5b;    /* epistemic: confirmed / risk-on */
    --spec:#b07514;         /* epistemic: unconfirmed / speculation */
    --riskoff:#a9463b;      /* risk-off */
    --spine:#aeb6c0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  .ui{font-family:"IBM Plex Sans",system-ui,sans-serif}

  /* ---- masthead ---- */
  header.mast{
    background:var(--frame);
    color:var(--frame-ink);
    border-bottom:1px solid #0c0e12;
  }
  .mast-row{
    max-width:1180px;margin:0 auto;padding:18px 28px 14px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{
    font-family:"IBM Plex Mono",monospace;font-weight:600;
    letter-spacing:.32em;font-size:22px;margin:0;text-transform:uppercase;
  }
  .brand .sub{font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;color:var(--frame-dim);letter-spacing:.02em}
  .mast-meta{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--frame-dim);line-height:1.7}
  .mast-meta .demo{
    display:inline-block;margin-top:4px;padding:2px 7px;border:1px solid #3a4150;border-radius:2px;
    color:#c9ced7;letter-spacing:.14em;font-size:10.5px;
  }

  /* ---- module tabs ---- */
  nav.tabs{background:var(--frame);border-bottom:1px solid #0c0e12}
  .tabs-row{max-width:1180px;margin:0 auto;padding:0 28px;display:flex;gap:0;overflow-x:auto}
  .tab{
    font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:500;
    color:var(--frame-dim);background:none;border:none;cursor:pointer;
    padding:11px 16px 12px;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.01em;
  }
  .tab:hover{color:var(--frame-ink)}
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
  .tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#5c6472;margin-right:7px}

  /* ---- regime hero ---- */
  .hero{background:#fbfbfc;border-bottom:1px solid var(--rule)}
  .hero-in{max-width:1180px;margin:0 auto;padding:22px 28px}
  .hero .eyebrow{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:8px;
  }
  .pill{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 9px;border-radius:2px;font-weight:500;border:1px solid transparent;
  }
  .pill--transition{background:#fbf1dd;color:#8a5a08;border-color:#e7d3a6}
  .pill--riskon{background:#e4f1e9;color:#2f6045;border-color:#bcdcc9}
  .pill--riskoff{background:#f6e3e0;color:#8f382e;border-color:#e6c3bd}
  .hero h2{
    font-family:"Newsreader",serif;font-weight:500;font-size:25px;line-height:1.3;margin:0;max-width:62ch;
  }
  .hero h2 b{font-weight:600}

  /* ---- layout ---- */
  main{max-width:1180px;margin:0 auto;padding:26px 28px 60px;display:grid;grid-template-columns:1fr 312px;gap:34px}
  @media(max-width:880px){main{grid-template-columns:1fr;gap:26px}}

  section.block{margin-bottom:26px;display:grid;grid-template-columns:40px 1fr;gap:14px}
  .letter{
    font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;color:var(--frame);
    border:1px solid var(--spine);border-radius:3px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .block h3{
    font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:8px 0 10px;
  }
  .block .body p{margin:0 0 11px}
  .block .body p:last-child{margin-bottom:0}

  ul.items{list-style:none;margin:0;padding:0}
  ul.items li{
    padding:11px 0;border-top:1px solid var(--rule);
  }
  ul.items li:first-child{border-top:none;padding-top:2px}
  .lead{font-weight:500}
  .src{
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
    display:inline-flex;gap:8px;margin-top:4px;
  }
  .why{color:#333a45;font-size:16px}

  .tag{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:1px 6px;border-radius:2px;vertical-align:middle;white-space:nowrap;border:1px solid transparent;
  }
  .tag--ok{background:#e6f0ea;color:var(--confirmed);border-color:#c4ded0}
  .tag--spec{background:#faf1de;color:var(--spec);border-color:#ecdcb6}
  .tag--skip{background:#eef0f2;color:#5a626c;border-color:#d3d9df}
  .tag--flag{background:#f6e3e0;color:#8f382e;border-color:#e6c3bd}
  .tag--mood{background:#e4edef;color:#2a6470;border-color:#bcd6db}

  /* ETF change badges */
  .chg{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid;white-space:nowrap;vertical-align:middle}
  .chg--index{background:#e7eef6;color:#2c5578;border-color:#c3d5e6}
  .chg--merge{background:#efe9f4;color:#5b4380;border-color:#d6c8e6}
  .chg--close{background:#f6e3e0;color:#8f382e;border-color:#e6c3bd}
  .chg--fee{background:#e6f0ea;color:#2f6045;border-color:#c4ded0}
  .chg--repl{background:#eef0f2;color:#3a4149;border-color:#d3d9df}
  .chg--dom{background:#faf1de;color:#8a5a08;border-color:#ecdcb6}
  .chg--name{background:#f0ece6;color:#6b5335;border-color:#ddd2c4}
  .intro-card{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:15px 17px;margin-bottom:20px}
  .intro-card p{margin:0;font-size:15.5px;color:#39414c}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:#39414c;background:#eef0f2;border:1px solid var(--rule);border-radius:3px;padding:2px 8px}

  /* ---- right rail ---- */
  aside{align-self:start}
  .rail-card{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:16px 17px;margin-bottom:18px}
  .rail-card h4{
    font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px;
  }
  .rail-card h4 .lt{font-family:"IBM Plex Mono",monospace;color:var(--frame)}
  .metric{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-top:1px dotted var(--rule);font-family:"IBM Plex Sans",sans-serif;font-size:14px}
  .metric:first-of-type{border-top:none}
  .metric .v{font-family:"IBM Plex Mono",monospace;color:var(--muted)}
  .vix{border-top:1px dotted var(--rule);margin-top:2px;padding-top:10px}
  .vix-head{display:flex;justify-content:space-between;align-items:baseline}
  .vix-label{font-family:"IBM Plex Sans",sans-serif;font-size:14px;color:#39414c}
  .vix-label .sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-top:1px}
  .vix-val{font-family:"IBM Plex Mono",monospace;font-size:18px;color:var(--ink);font-weight:500}
  .vix-zone{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;margin-left:7px;border:1px solid}
  .vix-zone.calm{background:#e6f0ea;color:#2f6045;border-color:#c4ded0}
  .vix-spark{width:100%;height:42px;margin-top:8px;display:block}
  .vix-cap{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.4}
  .noise li{font-size:15px;color:#3a4149;padding:8px 0;border-top:1px solid var(--rule)}
  .noise li:first-child{border-top:none}
  .caveat{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;font-style:normal}

  /* ---- empty modules ---- */
  .empty{grid-column:1/-1;background:var(--card);border:1px dashed #c3c9d0;border-radius:6px;padding:34px 30px;max-width:720px}
  .empty .k{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .empty h3{font-family:"Newsreader",serif;font-weight:500;font-size:22px;margin:8px 0 10px}
  .empty p{margin:0 0 14px;color:#39414c;font-size:16px;max-width:60ch}
  .empty .steps{font-family:"IBM Plex Sans",sans-serif;font-size:13.5px;color:var(--muted);line-height:1.7}
  .empty code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:#eef0f2;padding:1px 5px;border-radius:3px;color:#2a2f38}

  .panel{display:none}
  .panel.active{display:grid;grid-template-columns:1fr 312px;gap:34px}
  @media(max-width:880px){.panel.active{grid-template-columns:1fr}}
  .foot{max-width:1180px;margin:0 auto;padding:0 28px 40px;font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--muted);line-height:1.6}
  .foot b{color:#444c57}
  @media (prefers-reduced-motion:no-preference){.panel.active{animation:fade .25s ease}}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .arch-list{list-style:none;margin:12px 0 0;padding:0;columns:2;column-gap:26px}
  @media(max-width:600px){.arch-list{columns:1}}
  .arch-list li{break-inside:avoid;padding:7px 0;border-top:1px solid var(--rule)}
  .arch-list a{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--accent);text-decoration:none}
  .arch-list a:hover{text-decoration:underline}
  .arch-list .lbl{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--muted);margin-left:8px}

  /* market mini-rows */
  .mkt-card .mkt-row{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--rule);cursor:pointer;border-radius:4px}
  .mkt-card .mkt-row:first-of-type{border-top:none}
  .mkt-row:hover{background:#f5f7f8}
  .mkt-name{font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:#2b313a;display:block;line-height:1.15}
  .mkt-sub{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
  .mkt-spark{width:100%;height:26px;display:block;min-width:36px}
  .mkt-vals{text-align:right;white-space:nowrap}
  .mkt-val{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);display:block}
  .mkt-delta{font-family:"IBM Plex Mono",monospace;font-size:10px}
  .mkt-delta.up{color:var(--confirmed)} .mkt-delta.down{color:var(--riskoff)} .mkt-delta.flat{color:var(--muted)}
  .mkt-hint{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;color:var(--muted);margin-top:9px;line-height:1.4}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,23,29,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-backdrop[hidden]{display:none}
  .modal-card{position:relative;background:var(--card);border-radius:8px;max-width:680px;width:100%;padding:22px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.32)}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:4px}
  .modal-name{font-family:"Newsreader",serif;font-size:21px;font-weight:500;line-height:1.15}
  .modal-name .ms{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:3px}
  .modal-val{text-align:right;white-space:nowrap}
  .modal-val .mv{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:500;display:block}
  .modal-val .md{font-family:"IBM Plex Mono",monospace;font-size:12px}
  .modal-close{position:absolute;top:12px;right:15px;background:none;border:none;font-size:25px;color:var(--muted);cursor:pointer;line-height:1;padding:0}
  .modal-close:hover{color:var(--ink)}
  .modal-chart{width:100%;height:280px;margin-top:12px;display:block}
  .modal-meta{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--muted);margin-top:6px}

  /* storyline chains */
  .stories-wrap{grid-column:1/-1}
  .stories{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.stories{grid-template-columns:1fr}}
  .story{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px 18px}
  .story-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:3px}
  .story-title{font-family:"Newsreader",serif;font-size:18px;font-weight:600;line-height:1.2}
  .story-tags{white-space:nowrap;display:flex;gap:6px;align-items:center}
  .story-note{font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;color:var(--muted);margin-bottom:13px;line-height:1.45}
  .chain{list-style:none;margin:6px 0 0;padding:0}
  .chain-item{position:relative;padding:0 0 15px 20px}
  .chain-item::before{content:"";position:absolute;left:4px;top:5px;bottom:-1px;width:1px;background:var(--rule)}
  .chain-item:last-child{padding-bottom:2px}
  .chain-item:last-child::before{display:none}
  .chain-dot{position:absolute;left:0;top:4px;width:9px;height:9px;border-radius:50%;background:var(--muted);border:2px solid var(--card);box-shadow:0 0 0 1px var(--rule)}
  .kind-fact .chain-dot{background:var(--confirmed)}
  .kind-rumor .chain-dot{background:var(--spec)}
  .kind-estimate .chain-dot{background:var(--accent)}
  .chain-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
  .chain-date{color:var(--ink)}
  .chain-sum{font-size:14.5px;line-height:1.42;margin-top:1px}
  .chain-sum a{color:var(--accent);text-decoration:none}
  .chain-sum a:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="mast"><div class="mast-row">
  <div class="brand"><h1 id="brand-name"></h1><span class="sub" id="brand-sub"></span></div>
  <div class="mast-meta" id="mast-meta"></div>
</div></header>
<nav class="tabs"><div class="tabs-row" id="tabs" role="tablist"></div></nav>
<section class="hero" id="hero" style="display:none"></section>
<main id="stage"></main>
<div class="foot" id="foot"></div>
<div class="modal-backdrop" id="modal" hidden><div class="modal-card" id="modal-body"></div></div>

<script>

ra — strukturális részesedés-elmozdulás.", "src": ["Mercury Research", "2026-Q2"]}]}, {"letter": "G", "heading": "Tech szektor csomag — félvezető & AI-infra", "body": ["<b>Félvezető:</b> az AMD 30,3%-os kliens x86-részesedése tartós elmozdulás. A Jalapeño (N3P, HBM4, +25% hatékonyság-ígéret) inference-specifikus — rugalmasságot áldoz a hatékonyságért.", "<b>Capex / memória:</b> az AI-adatközpontok miatti memória- és NAND-drágulás beépült a fogyasztói hardver árába. A memória (HBM4) strukturális szűk keresztmetszet.", "<b>Szabályozás & dual-use:</b> H-1B díj, ARIA AI-zene kizárás, autonóm drón Nvidia Jetson Orinnal — él-számítás katonai felhasználása geopolitikai réteg."]}, {"letter": "EN", "letterStyle": "font-size:11px", "heading": "Energia szektor — atom & új energia kiemelten", "body": ["<b>Atom (kiemelt):</b> a hyperscalerek eddig ~9,8 GW atomkapacitást kötöttek le AI-adatközpontokra, 13 megállapodásban — a Meta vezet (~6,6 GW), a Microsoft legérettebb ügye a Three Mile Island Unit 1 újraindítása (835 MW, cél 2027 H2). Az SMR-ek zöme csak a 2030-as évek elején indul — a bejelentés-momentum fut a kapacitás előtt. <span class='mono' style='font-size:12px'>(minta)</span>", "<b>Új energia:</b> fejlett geotermia, hosszú kiürülésű tárolás, hálózati összeköttetés a fő szál. Az adatközpont-áramigény (IEA: ~945 TWh 2030-ra) tartós baseload-keresletet teremt; a nap/szél olcsó, de a 24/7 baseloadot önmagában nem fedi. <span class='mono' style='font-size:12px'>(minta)</span>", "<b>Miért itt a helye:</b> az AI-capex és az energia ugyanannak a szűk keresztmetszetnek a két oldala (chip + áram). A strukturális jel: ki szerez tartós, olcsó baseloadot."]}, {"letter": "I", "heading": "Ellenoldal / kockázat — steelman", "body": ["Ha a memória/NAND-sokk tartós, a hardver-marzsok és a helyi-AI narratíva alsó szegmense sérül, a halmozódó H-1B teher strukturálisan emeli a tech bérköltséget. <b>Amire kevesen figyelnek:</b> a hyperscaler saját-lapka trend középtávon az Nvidia árazási ere let DATA = FALLBACK, ACTIVE = null;

const CHG = ['index','fee','merge','close','repl','dom','name'];
const esc = s => (s==null?'':String(s));
function tagCls(k){ return CHG.includes(k) ? ('chg chg--'+k) : ('tag tag--'+k); }
function tags(arr){ return (arr||[]).map(t=>`<span class="${tagCls(t.k)}">${esc(t.t)}</span>`).join(' '); }

function item(it){
  return `<li><div class="lead">${esc(it.lead)} ${tags(it.tags)}</div>`
    + (it.why?`<div class="why">${esc(it.why)}</div>`:'')
    + (it.src?`<div class="src mono">${it.src.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:'')
    + `</li>`;
}
function section(s){
  if(s.type==='intro'){
    let leg = s.legend?`<div class="legend">${s.legend.map(t=>`<span class="${tagCls(t.k)}">${esc(t.t)}</span>`).join('')}</div>`:'';
    return `<div class="intro-card"><p>${s.html}</p>${leg}</div>`;
  }
  let inner = '';
  if(s.note) inner += `<p class="caveat" style="font-size:14px;margin:0 0 12px">${s.note}</p>`;
  if(s.items) inner += `<ul class="items">${s.items.map(item).join('')}</ul>`;
  if(s.body) inner += `<div class="body">${s.body.map(p=>`<p>${p}</p>`).join('')}</div>`;
  const ls = s.letterStyle?` style="${s.letterStyle}"`:'';
  return `<section class="block"><div class="letter"${ls}>${esc(s.letter)}</div><div><h3>${s.heading}</h3>${inner}</div></section>`;
}
function geom(s,w,h,pad){
  const x0=pad,x1=w-pad,yT=pad,yB=h-pad;
  const mn=Math.min.apply(0,s), mx=Math.max.apply(0,s), rng=(mx-mn)||1;
  const X=i=>x0+(x1-x0)*i/(s.length-1), Y=v=>yB-(yB-yT)*(v-mn)/rng;
  const pts=s.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const area='M'+X(0).toFixed(1)+','+yB.toFixed(1)+' '+s.map((v,i)=>'L'+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+' L'+X(s.length-1).toFixed(1)+','+yB.toFixed(1)+' Z';
  return {pts,area,lx:X(s.length-1),ly:Y(s[s.length-1]),mn,mx};
}
function mktColor(d){ return d==='down'?'var(--riskoff)':(d==='up'?'var(--confirmed)':'var(--muted)'); }
function mktArrow(d){ return d==='down'?'▼':(d==='up'?'▲':'■'); }
function mktRow(inst,i){
  const g=geom(inst.series,110,26,3), col=mktColor(inst.dir);
  return `<div class="mkt-row" data-mkt="${i}" role="button" tabindex="0">`
    +`<div><span class="mkt-name">${esc(inst.name)}</span><span class="mkt-sub">${esc(inst.sub||'')}</span></div>`
    +`<svg class="mkt-spark" viewBox="0 0 110 26" preserveAspectRatio="none" aria-hidden="true"><path d="${g.area}" fill="${col}" fill-opacity="0.09"/><polyline points="${g.pts}" fill="none" stroke="${col}" stroke-width="1.4" stroke-linejoin="round"/></svg>`
    +`<div class="mkt-vals"><span class="mkt-val">${esc(inst.value)}</span><span class="mkt-delta ${inst.dir}">${mktArrow(inst.dir)} ${esc(inst.delta)}</span></div></div>`;
}
function fmtN(n){ return (Math.round(n*1000)/1000).toLocaleString('hu-HU'); }
function bigChart(inst){
  const g=geom(inst.series,640,240,28), col=mktColor(inst.dir);
  return `<svg class="modal-chart" viewBox="0 0 640 240" preserveAspectRatio="none">`
    +`<line x1="28" y1="20" x2="28" y2="212" stroke="var(--rule)"/><line x1="28" y1="212" x2="616" y2="212" stroke="var(--rule)"/>`
    +`<path d="${g.area}" fill="${col}" fill-opacity="0.08"/>`
    +`<polyline points="${g.pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`
    +`<circle cx="${g.lx.toFixed(1)}" cy="${g.ly.toFixed(1)}" r="3.6" fill="${col}"/>`
    +`<text x="34" y="28" font-family="IBM Plex Mono" font-size="10" fill="var(--muted)">${fmtN(g.mx)}</text>`
    +`<text x="34" y="208" font-family="IBM Plex Mono" font-size="10" fill="var(--muted)">${fmtN(g.mn)}</text></svg>`;
}
function openModal(inst){
  const col=mktColor(inst.dir);
  document.getElementById('modal-body').innerHTML =
     `<button class="modal-close" aria-label="Bezár">×</button>`
    +`<div class="modal-head"><div class="modal-name">${esc(inst.name)}<span class="ms">${esc(inst.sub||'')}</span></div>`
    +`<div class="modal-val"><span class="mv">${esc(inst.value)}</span><span class="md" style="color:${col}">${mktArrow(inst.dir)} ${esc(inst.delta)}</span></div></div>`
    + bigChart(inst)
    +`<div class="modal-meta">~30 munkanap · minta-görbe, élesben a menetrendezett feladat frissíti valós adattal.</div>`;
  document.getElementById('modal').hidden=false;
}
function closeModal(){ document.getElementById('modal').hidden=true; }
function storyline(s){
  const st = s.statusKind?`<span class="tag tag--${s.statusKind}">${esc(s.status)}</span>`:'';
  const tg = s.tag?`<span class="chip">${esc(s.tag)}</span>`:'';
  const items = (s.entries||[]).map(e=>{
    const sum = e.url?`<a href="${e.url}" target="_blank" rel="noopener">${esc(e.summary)}</a>`:esc(e.summary);
    return `<li class="chain-item kind-${e.kind||'fact'}"><span class="chain-dot"></span><div class="chain-body"><div class="chain-meta"><span class="chain-date">${esc(e.date)}</span> · ${esc(e.source)}</div><div class="chain-sum">${sum}</div></div></li>`;
  }).join('');
  return `<div class="story"><div class="story-head"><span class="story-title">${esc(s.title)}</span><span class="story-tags">${st}${tg}</span></div>`
    + (s.note?`<div class="story-note">${esc(s.note)}</div>`:'')
    + `<ol class="chain">${items}</ol></div>`;
}
function vix(v){
  const s=v.series, x0=4,x1=256,yTop=5,yBot=37;
  const vmin=Math.min.apply(0,s)-0.4, vmax=Math.max.apply(0,s)+0.4;
  const X=i=>x0+(x1-x0)*i/(s.length-1), Y=val=>yBot-(yBot-yTop)*(val-vmin)/(vmax-vmin);
  const pts=s.map((val,i)=>X(i).toFixed(1)+','+Y(val).toFixed(1)).join(' ');
  let area='M'+X(0).toFixed(1)+','+yBot+' '+s.map((val,i)=>'L'+X(i).toFixed(1)+','+Y(val).toFixed(1)).join(' ')+' L'+X(s.length-1).toFixed(1)+','+yBot+' Z';
  const lx=X(s.length-1).toFixed(1), ly=Y(s[s.length-1]).toFixed(1);
  return `<div class="vix"><div class="vix-head"><span class="vix-label">VIX<span class="sub">CBOE volatilitás</span></span>`
    +`<span><span class="vix-val">${esc(v.value)}</span><span class="vix-zone ${v.zoneClass||'calm'}">${esc(v.zone)}</span></span></div>`
    +`<svg class="vix-spark" viewBox="0 0 260 42" preserveAspectRatio="none" aria-hidden="true">`
    +`<path d="${area}" fill="var(--accent)" fill-opacity="0.08"/>`
    +`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`
    +`<circle cx="${lx}" cy="${ly}" r="2.6" fill="var(--accent)"/></svg>`
    +`<div class="vix-cap">${esc(v.cap)}</div></div>`;
}
function rail(c){
  let h = `<div class="rail-card"><h4>${c.lt?`<span class="lt">${esc(c.lt)}</span> `:''}${c.heading}</h4>`;
  if(c.metrics) h += c.metrics.map(m=>`<div class="metric"><span>${m.k}</span><span class="v">${esc(m.v)}</span></div>`).join('');
  if(c.vix) h += vix(c.vix);
  if(c.markets){ window.__MKT=c.markets; h += `<div class="mkt-card">`+c.markets.map(mktRow).join('')+`</div>`; if(c.hint) h += `<div class="mkt-hint">${c.hint}</div>`; }
  if(c.chips) h += `<div class="chips">${c.chips.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`;
  if(c.list) h += `<ul class="items noise" style="list-style:none;padding:0;margin:8px 0 0">${c.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(c.note) h += `<div class="caveat">${c.note}</div>`;
  return h + `</div>`;
}
function panelHTML(t){
  if(t.empty){
    const e=t.empty;
    return `<div class="empty"><div class="k">${esc(e.k)}</div><h3>${e.heading}</h3><p>${e.text}</p><div class="steps">${e.steps}</div></div>`;
  }
  if(t.storylines){
    const intro = t.intro?`<div class="intro-card"><p>${t.intro}</p></div>`:'';
    return `<div class="stories-wrap">${intro}<div class="stories">${t.storylines.map(storyline).join('')}</div></div>`;
  }
  if(t.archive){
    const rows = t.archive.map(a=>`<li><a href="./data/${a.file}">${esc(a.date)}</a><span class="lbl">napi jelentés</span></li>`).join('');
    return `<div class="empty"><div class="k">Archívum</div><h3>Korábbi futások</h3><p>Minden futás dátumozott, verziózott fájl — a strukturális elmozdulások visszakereséséhez.</p><ul class="arch-list">${rows}</ul></div>`;
  }
  const main = `<div class="col-main">${(t.sections||[]).map(section).join('')}</div>`;
  const aside = t.rail?`<aside>${t.rail.map(rail).join('')}</aside>`:'';
  return main + aside;
}
function renderHero(){
  const r=DATA.regime, hero=document.getElementById('hero');
  const t=DATA.tabs.find(x=>x.id===ACTIVE);
  if(t && t.hero && r){
    hero.style.display='';
    hero.innerHTML=`<div class="hero-in"><div class="eyebrow">A · Rezsim-olvasat <span class="pill pill--${r.state}">${esc(r.label)}</span></div><h2>${r.text}</h2></div>`;
  } else hero.style.display='none';
}
function show(id){
  ACTIVE=id;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===id));
  renderHero();
  document.getElementById('stage').innerHTML = panelHTML(DATA.tabs.find(x=>x.id===id));
  window.scrollTo({top:0,behavior:'instant'});
}
function init(){
  const b=DATA.brand||{name:'Őrtorony',sub:''};
  document.getElementById('brand-name').textContent=b.name;
  document.getElementById('brand-sub').textContent=b.sub;
  const m=DATA.meta||{};
  document.getElementById('mast-meta').innerHTML =
    `${esc(m.date)}${m.time?' · '+esc(m.time):''}<br>utolsó futás: ${esc(m.run||'—')}`
    + (m.demo?`<br><span class="demo">MINTA-TARTALOM</span>`:'');
  document.getElementById('foot').innerHTML =
    `<b>Nem befektetési tanács.</b> A tartalom tájékoztató jellegű, kontextust ad — a döntést az olvasó hozza. · ${m.demo?'A blokkok egy része <b>minta</b>; élesben a menetrendezett feladatok töltik fel valós, forrással jelölt adattal. · ':''}Őrtorony`;
  const nav=document.getElementById('tabs');
  nav.innerHTML = DATA.tabs.map((t,i)=>`<button class="tab" role="tab" data-id="${t.id}" aria-selected="${i===0}"><span class="n">${String(i+1).padStart(2,'0')}</span>${t.label}</button>`).join('');
  nav.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>show(btn.dataset.id)));
  const stage=document.getElementById('stage');
  stage.addEventListener('click',e=>{ const r=e.target.closest('.mkt-row'); if(r&&window.__MKT) openModal(window.__MKT[+r.dataset.mkt]); });
  stage.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')){ const r=e.target.closest('.mkt-row'); if(r&&window.__MKT){ e.preventDefault(); openModal(window.__MKT[+r.dataset.mkt]); } } });
  const md=document.getElementById('modal');
  md.addEventListener('click',e=>{ if(e.target===md||e.target.classList.contains('modal-close')) closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
  show(DATA.tabs[0].id);
}
function mergeData(fb, live){
  const out = Object.assign({}, fb, live);
  const byId = {}; (live.tabs||[]).forEach(t=>byId[t.id]=t);
  out.tabs = (fb.tabs||[]).map(t=> byId[t.id] || t);
  (live.tabs||[]).forEach(t=>{ if(!out.tabs.some(x=>x.id===t.id)) out.tabs.push(t); });
  return out;
}
// Live data if served; embedded fallback if opened as a local file.
fetch('./data/latest.json',{cache:'no-store'})
  .then(r=>r.ok?r.json():Promise.reject())
  .then(d=>{DATA=mergeData(FALLBACK,d); init();})
  .catch(()=>init());
</script>
